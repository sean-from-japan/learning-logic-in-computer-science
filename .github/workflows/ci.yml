name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: pytest

      - name: Smoke test the command line
        shell: bash
        run: |
          set -e
          logickit --version
          logickit table "p | ~p"
          logickit solve "p & (~p | q)" --trace
          logickit unify "f(X, b)" "f(a, Y)"
          logickit check "G !(a & b)"
          # these exit 1 on purpose: the property does not hold
          logickit entails "p" --premise "p -> q" --premise "q" && exit 1 || true
          logickit check "G F a" && exit 1 || true
          echo "command line smoke test passed"
